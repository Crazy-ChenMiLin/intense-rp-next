{% from "macros.html" import web_button %}
<section class="view hotswap-view" data-view="model-switch">
  <div class="hotswap-view__panel">
    <h1 class="hotswap-view__title">选择模型</h1>
    <div id="model-provider-block" class="loadout-provider-block hidden">
      <span class="loadout-provider-block__label">提供商</span>
      <div id="model-provider-dropdown" class="custom-select">
        <button id="model-provider-button" class="custom-select__button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="custom-select__value">
            <span class="custom-select__icon" aria-hidden="true">
              <img id="model-provider-button-icon" src="" alt="">
            </span>
            <span id="model-provider-button-label" class="custom-select__label"></span>
          </span>
          <span class="custom-select__chevron" aria-hidden="true">
            <img src="{{ asset_urls.icons.chevron_down }}" alt="">
          </span>
        </button>
        <div id="model-provider-menu" class="custom-select__menu" role="listbox" aria-hidden="true"></div>
      </div>
    </div>
    <div id="model-switch-list" class="model-switch-list"></div>
    <div id="model-switch-footer" class="loadout-switch-footer is-single">
      {{ web_button("model-switch-back-button", "返回", variant="secondary") }}
      {{ web_button("model-switch-confirm-button", "确认", variant="accent", icon_url=asset_urls.icons.check, icon_alt="确认") }}
    </div>
    <p id="model-switch-status" class="status-text"></p>
  </div>
</section>
